<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Share+Tech+Mono&family=Outfit:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080B14;
    --panel:#0F1626;
    --panel-2:#0B1120;
    --border:#1E2A44;
    --border-soft:#161F35;
    --amber:#FFB300;
    --amber-dim:#8a6414;
    --amber-glow: rgba(255,179,0,0.15);
    --cyan:#5FE0FF;
    --text:#D7DEEE;
    --text-dim:#7C88A6;
    --go:#33D68B;
    --go-dim: rgba(51,214,139,0.12);
    --nogo:#FF5C6C;
    --nogo-dim: rgba(255,92,108,0.12);
    --swap:#B98CFF;
    --swap-dim: rgba(185,140,255,0.12);
    --mono: 'Instrument Sans','IBM Plex Sans',system-ui,sans-serif;
    --sans: 'Instrument Sans','IBM Plex Sans', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(ellipse at top, #0C1220 0%, var(--bg) 55%);
    color: var(--text);
    font-family: var(--sans);
    min-height:100vh;
    padding: 18px 14px 60px;
  }
  @media(min-width:640px){ body{ padding: 32px 24px 80px; } }

  .wrap{ max-width: 760px; margin: 0 auto; position:relative; z-index:1; }
  .wrap.hidden{ display:none; }

  /* ---- access portal ---- */
  #access-portal{
    position:fixed; inset:0; z-index:300;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(ellipse at 50% 30%, #10182B 0%, #060A14 75%);
    padding: 20px;
  }
  #access-portal.hidden{ display:none; }
  .legal-ft{ text-align:center; font:10.5px/1.5 var(--mono); color:#5b6577; padding:0 8px; }
  .legal-ft.portal{ position:absolute; left:0; right:0; bottom:14px; }
  .legal-ft.main{ margin:22px 0 10px; }
  .support-wrap{ margin:0; display:inline; } .support-wrap.hidden{ display:none; } .support-lk{ display:inline; padding:0; border:0; background:none; border-radius:0; color:#5aa9ff; font:inherit; font-weight:600; letter-spacing:0; text-transform:none; text-decoration:none; }
  .ft-row{ text-align:center; } .ft-row a{ white-space:nowrap; }
  .ft-row{ font:12px var(--sans); color:#c9d0de; } .ft-row a{ color:#7f9bc9; font-weight:500; text-decoration:none; } .ft-row i{ font-style:normal; margin:0 10px; color:#3c4860; } .ft-rights{ margin-top:12px; color:#4f5a70; } .legal-ft.main{ border-top:1px solid #151d33; margin:26px 40px 10px; padding-top:20px; }
  .pp-text{ padding:0 2px; font-size:13px; line-height:1.6; color:#9aa6bf; }
  .pp-text p{ margin:0 0 10px; } .pp-text h4{ margin:20px 0 8px; font:700 13.5px var(--sans); color:var(--text); } .pp-text ul{ margin:0 0 8px; padding-left:18px; } .pp-text li{ margin-bottom:4px; } .pp-text li b{ color:var(--text); font-weight:600; } .pp-text h3{ margin:0 0 6px; font:800 15px var(--mono); letter-spacing:.06em; color:var(--amber); } .pp-text h5{ margin:14px 0 6px; font:700 12.5px var(--sans); color:var(--text); } .pp-text hr{ border:0; border-top:1px solid var(--border); margin:16px 0; } .pp-text li::marker{ color:var(--amber); } .pp-text p{ margin:0 0 12px; } .pp-text a{ color:#5aa9ff; font-weight:600; text-decoration:none; } .pp-text p:last-child{ margin-bottom:0; }
  .legal-lk{ display:inline-flex; align-items:center; gap:6px; margin-top:4px; cursor:pointer; color:#7b86a0; letter-spacing:.12em; font-size:10px; text-transform:uppercase; }
  .legal-lk svg{ width:10px; height:10px; stroke:currentColor; fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; transition:transform .2s; }
  .legal-ft.open .legal-lk svg{ transform:rotate(180deg); }
  .legal-full{ display:none; margin:10px auto 0; max-width:340px; padding:10px 12px; border:1px dashed #27344f; border-radius:8px; font:11px/1.55 var(--sans); color:#6d7790; text-align:left; background:rgba(8,11,20,.85); }
  .legal-ft.open .legal-full{ display:block; }
  #maintenance-screen{
    position:fixed; inset:0; z-index:290;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(ellipse at 50% 30%, #10182B 0%, #060A14 75%);
    padding: 20px;
  }
  #maintenance-screen.hidden{ display:none; }
  .access-card{
    width:340px; max-width:100%;
    background: linear-gradient(180deg, #10182B 0%, #0A1120 100%);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 36px 28px 32px;
    text-align:center;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    animation: accessCardIn 0.6s cubic-bezier(0.34,1.1,0.64,1) both;
  }
  @keyframes accessCardIn{
    0%{ opacity:0; transform: translateY(14px) scale(0.97); }
    100%{ opacity:1; transform: translateY(0) scale(1); }
  }
  .access-logo{ display:flex; justify-content:center; margin-bottom:14px; }
  .access-eyebrow{
    font-family: var(--mono); font-size:11px; letter-spacing:0.16em;
    color: var(--cyan); text-transform:uppercase; margin:0 0 2px;
  }
  .access-title{
    font-family: var(--mono); font-weight:700; font-size:26px;
    letter-spacing:0.02em; color: var(--amber);
    text-shadow: 0 0 18px var(--amber-glow); margin:0 0 17px;
  }
  .access-sub{ font-size:12.5px; color: var(--text-dim); margin:0 0 22px; }
  .access-field{ margin-bottom:10px; position:relative; }
  .pw-eye{ position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:0; padding:6px; cursor:pointer; color:var(--text-dim); display:flex; }
  .pw-eye svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .pw-eye.on{ color:var(--cyan); }
  .access-field input{
    width:100%; text-align:center; letter-spacing:0.08em;
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); font-family: var(--sans); font-size:15px;
    padding: 12px 14px; border-radius: 8px; outline:none;
  }
  .access-field input:focus{ border-color: var(--cyan); }
  .access-error{ color: var(--nogo); font-size:12.5px; margin-bottom:10px; }
  .access-error.hidden{ display:none; }
  .access-btn{
    width:100%; font-family: var(--mono); font-size:12.5px; font-weight:700; letter-spacing:0.08em;
    color: #1A1200; background: linear-gradient(180deg, #FFC94D, var(--amber));
    border:none; border-radius:8px; padding:13px; cursor:pointer;
    box-shadow: 0 6px 18px rgba(255,179,0,0.25);
  }
  .access-btn:active{ transform: translateY(1px); }

  .bg-fx{
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    width: 100%; height: 100%; display:block;
  }

  /* ---- Header / board marquee ---- */
  .board-header{
    background: linear-gradient(180deg, #10182B 0%, #0A1120 100%);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .board-header::after{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(180deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 4px);
    pointer-events:none;
  }
  .board-logo{
    position:absolute; top:8px; right:10px; z-index:1;
    animation: logoAppear 0.8s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes logoAppear{
    0%{ opacity:0; transform: scale(0.25) rotate(-25deg); }
    60%{ opacity:1; transform: scale(1.12) rotate(4deg); }
    100%{ opacity:1; transform: scale(1) rotate(0deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .board-logo{ animation:none; }
  }
  .eyebrow{
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    color: var(--cyan);
    text-transform: uppercase;
    margin: 0 0 6px;
  }
  h1{
    font-family: var(--mono);
    font-weight: 700;
    font-size: clamp(22px, 5vw, 30px);
    letter-spacing: 0.02em;
    color: var(--amber);
    text-shadow: 0 0 18px var(--amber-glow);
    margin: 0 0 4px;
  }
  .sub{
    font-size: 13px;
    color: var(--text-dim);
    margin: 0;
  }
  .board-stats{
    display:flex; gap:16px; margin-top:14px; flex-wrap:wrap; align-items:center;
    font-family: var(--mono); font-size: 11px; color: var(--text-dim);
  }
  .board-stats b{ color: var(--cyan); font-weight:600; }
  .stat-link{ cursor:pointer; }
  .stat-link:hover{ color: var(--cyan); }
  /* Explicit divider elements (not CSS ::before tricks) — these sit as real flex items, so
     they space correctly with justify-content:space-between's variable gaps, unlike a fixed
     -8px offset pseudo-element would. */
  .header-divider{ color: rgba(95, 224, 255, 0.35); }
  /* Removing the icons earlier freed up enough room that everything now fits on one line even
     on a narrow phone screen, so the same space-evenly spread works consistently everywhere —
     no more separate narrow-screen override needed. */
  .nav-tabs-row{ justify-content: space-evenly; }
  .board-stats-top{
    border-top: 1px solid rgba(95, 224, 255, 0.12); border-bottom: 1px solid rgba(95, 224, 255, 0.12);
    padding: 10px 0; justify-content: space-between;
  }

  /* ---- Tabs ---- */
  .tabs{ display:flex; gap:8px; margin-bottom:16px; }
  .tab-btn{
    flex:1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 12.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 12px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .tab-btn.active{
    background: var(--panel);
    border-color: var(--amber-dim);
    color: var(--amber);
    box-shadow: inset 0 0 0 1px rgba(255,179,0,0.15);
  }
  .tab-btn:focus-visible{ outline: 2px solid var(--cyan); outline-offset: 2px; }


  /* ================= THEMES — every non-Clássico theme gets <html class="themed theme-ID">; colours come from the tokens below ================= */
  html.theme-pro{
    --bg:#0d1217; --panel:#161e27; --panel-2:#11181f; --border:#26323f; --border-soft:#1d2833;
    --text:#e9eef2; --text-dim:#8795a3; --acc:#ffb81c; --acc-dim:#7a5a10; --on-acc:#0d1217; --fav-bg:#1b1d1a;
    --tk-bg:#e9eef2; --tk-ink:#0d1217; --tk-dim:#4a5866; --tk-mute:#9aa6b2; --tk-line:#b4bec8;
    --r:12px; --r2:16px; --disp:'Big Shoulders Display';
  }
  /* ---- SKINS: keep the original (Clássico) layout exactly, change the look. <html class="skin-ID"> ---- */
  html.skin-radar{
    --bg:#030a05; --panel:#06130a; --panel-2:#040d07; --border:#14452a; --border-soft:#0d2e1c;
    --amber:#42ff86; --amber-dim:#1f8a47; --amber-glow:rgba(66,255,134,.35); --cyan:#9dffc0; --text:#c6f7d4; --text-dim:#5fa77a;
  }
  html.skin-radar body::after{ content:""; position:fixed; inset:0; pointer-events:none; z-index:9998; background:repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px); }
  html.skin-radar .board-header{ background:linear-gradient(180deg,#07190d,#040d07); border-color:#14452a; border-radius:3px; }
  html.skin-radar .panel, html.skin-radar .context-line, html.skin-radar .tab-btn, html.skin-radar .btn, html.skin-radar input[type=text], html.skin-radar .custom-select-trigger{ border-radius:2px; }
  html.skin-radar h1, html.skin-radar .board-stats b, html.skin-radar .tab-btn.active, html.skin-radar label, html.skin-radar .context-line b{ text-shadow:0 0 7px rgba(66,255,134,.55); }
  html.skin-radar #logged-in-tab-row{ background:#030a05 !important; border-color:#14452a !important; }
  html.skin-radar #planeamento-turnaround-row{ background:rgba(66,255,134,.05) !important; border-color:#14452a !important; }
  html.skin-radar .btn{ background:#42ff86; color:#02140a; box-shadow:0 0 14px rgba(66,255,134,.35); }
  html.skin-radar .tab-btn.active{ background:#06130a; box-shadow:inset 0 0 0 1px rgba(66,255,134,.3), 0 0 12px rgba(66,255,134,.2); }
  html.skin-radar .bg-fx{ opacity:.35; filter:hue-rotate(-70deg); }
  html.skin-panel{
    --bg:#0b0e12; --panel:#171c22; --panel-2:#10141a; --border:#323b46; --border-soft:#252d36;
    --amber:#ffa726; --amber-dim:#8a5a12; --amber-glow:rgba(255,167,38,.25); --cyan:#8fd8ff; --text:#dfe5ea; --text-dim:#8693a0;
  }
  html.skin-panel .bg-fx{ display:none; }
  html.skin-panel .board-header, html.skin-panel .panel{
    background:radial-gradient(circle at 11px 11px,#58626d 2.5px,transparent 3.2px), radial-gradient(circle at calc(100% - 11px) 11px,#58626d 2.5px,transparent 3.2px), radial-gradient(circle at 11px calc(100% - 11px),#58626d 2.5px,transparent 3.2px), radial-gradient(circle at calc(100% - 11px) calc(100% - 11px),#58626d 2.5px,transparent 3.2px), linear-gradient(180deg,#1e252d,#141a20);
    border:1px solid #3a4450; border-radius:12px; box-shadow:inset 0 1px 0 rgba(255,255,255,.08), inset 0 -3px 8px rgba(0,0,0,.45), 0 8px 18px rgba(0,0,0,.55);
  }
  html.skin-panel .board-header::after{ display:none; }
  html.skin-panel .tab-btn{ background:linear-gradient(180deg,#2b343e,#1b2128); border:1px solid #3d4854; border-bottom:3px solid #0a0c0f; border-radius:9px; color:#aab4bf; }
  html.skin-panel .tab-btn.active{ background:linear-gradient(180deg,#14191e,#1a2027); border-color:var(--amber); border-bottom-width:1px; transform:translateY(2px); color:var(--amber); box-shadow:inset 0 0 16px rgba(255,167,38,.28), inset 0 3px 6px rgba(0,0,0,.6); }
  html.skin-panel input[type=text], html.skin-panel input[type=number], html.skin-panel select, html.skin-panel .custom-select-trigger{ background:#080b0f; border:1px solid #2c343e; box-shadow:inset 0 3px 7px rgba(0,0,0,.7); border-radius:8px; }
  html.skin-panel .context-line{ background:#080b0f; border:1px solid #2c343e; box-shadow:inset 0 3px 8px rgba(0,0,0,.7); border-radius:8px; }
  html.skin-panel .btn{ background:linear-gradient(180deg,#ffc05a,#ee8f0e); color:#2a1800; border-bottom:3px solid #8a5000; border-radius:9px; box-shadow:0 3px 0 rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.4); }
  html.skin-panel #logged-in-tab-row{ background:#080b0f !important; border-color:#2c343e !important; box-shadow:inset 0 3px 8px rgba(0,0,0,.7); }
  html.skin-panel #planeamento-turnaround-row{ background:#11161b !important; border-color:#2c343e !important; backdrop-filter:none !important; }
  html.skin-planta{
    --bg:#0a2540; --panel:rgba(10,37,64,.78); --panel-2:rgba(255,255,255,.035); --border:rgba(190,220,255,.38); --border-soft:rgba(190,220,255,.2);
    --amber:#ffd23f; --amber-dim:#8a7420; --amber-glow:transparent; --cyan:#bfe0ff; --text:#e6f1ff; --text-dim:#86a9d4;
    --mono:'Share Tech Mono','IBM Plex Mono',monospace;
  }
  html.skin-planta .bg-fx{ display:none; }
  html.skin-planta body{ background-color:#0a2540; background-image:linear-gradient(rgba(190,220,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(190,220,255,.07) 1px,transparent 1px); background-size:24px 24px; }
  html.skin-planta .board-header{ background:transparent; border:1px solid rgba(190,220,255,.5); border-radius:2px; }
  html.skin-planta .board-header::after{ display:none; }
  html.skin-planta .panel, html.skin-planta .context-line, html.skin-planta .tab-btn, html.skin-planta .btn, html.skin-planta input[type=text], html.skin-planta .custom-select-trigger{ border-radius:2px; }
  html.skin-planta .panel{ border:1px solid rgba(190,220,255,.4); }
  html.skin-planta .tab-btn{ background:transparent; }
  html.skin-planta .tab-btn.active{ background:transparent; border:2px solid #ffd23f; box-shadow:none; }
  html.skin-planta .btn{ background:transparent; color:#ffd23f; border:1px solid #ffd23f; letter-spacing:.14em; }
  html.skin-planta #logged-in-tab-row{ background:rgba(10,37,64,.9) !important; border-color:rgba(190,220,255,.4) !important; }
  html.skin-planta #planeamento-turnaround-row{ background:rgba(255,255,255,.03) !important; border-color:rgba(190,220,255,.4) !important; }
  html.skin-planta .context-line{ position:relative; background:transparent; border:1px solid rgba(190,220,255,.4); }
  html.skin-planta .context-line::before, html.skin-planta .context-line::after{ content:""; position:absolute; width:10px; height:10px; border:2px solid #ffd23f; }
  html.skin-planta .context-line::before{ top:-1px; left:-1px; border-right:0; border-bottom:0; } html.skin-planta .context-line::after{ bottom:-1px; right:-1px; border-left:0; border-top:0; }
  html[class*="skin-"] .area-card.fav{ border-color:var(--amber); background:var(--panel-2); box-shadow:0 0 0 1px var(--amber-glow); }
  html[class*="skin-"] .area-card.fav .ac-ic{ background:var(--panel); border-color:var(--amber-dim); color:var(--amber); }
  html[class*="skin-"] .area-favlbl{ color:var(--amber); }
  html[class*="skin-"] #area-hub-sep{ background:linear-gradient(90deg, transparent, var(--amber) 20%, var(--amber) 80%, transparent); }
  html.themed{
    --amber:var(--acc); --amber-dim:var(--acc-dim); --amber-glow:transparent; --cyan:var(--text);
    --sans:'Instrument Sans','IBM Plex Sans',system-ui,sans-serif;
    --mono:'Instrument Sans','IBM Plex Sans',system-ui,sans-serif;   /* no typewriter font anywhere */
  }
  html.themed body{ background:var(--bg); font-family:var(--sans); }
  html.themed .bg-fx{ display:none; }
  html.themed .board-header{ background:transparent; border:none; border-radius:0; padding:6px 2px 0; }
  html.themed .board-header::after{ display:none; }

  html.themed .board-logo svg{ width:44px; height:44px; }
  html.themed .eyebrow{ display:none; }
  html.themed h1{ font-family:var(--disp),var(--sans); font-weight:800; font-size:clamp(34px,9vw,44px); letter-spacing:.01em; line-height:1; color:var(--text); text-shadow:none; margin:0 0 10px; }

  html.themed .board-stats-top{ border:none; padding:0 0 12px; justify-content:flex-start; gap:18px; }
  html.themed .header-divider{ display:none; }
  html.themed #planeamento-turnaround-row{ background:transparent !important; backdrop-filter:none !important; -webkit-backdrop-filter:none !important; border:none !important; border-top:1px solid var(--border) !important; border-bottom:1px solid var(--border) !important; border-radius:0 !important; padding:12px 0 !important; margin-top:4px !important; }
  html.themed #planeamento-turnaround-row .stat-link{ color:var(--text) !important; font-family:var(--sans); font-weight:600; font-size:12px; letter-spacing:.08em; }
  html.themed #planeamento-turnaround-row #my-swaps-link{ color:var(--amber) !important; }
  /* header tabs: the open one gets an underline, the other one dims (nothing open = both normal) */
  #my-swaps-link, #tools-link{ padding-bottom:3px; border-bottom:2px solid transparent; transition:opacity .15s; }
  body:has(#panel-my-swaps:not(.hidden)) #my-swaps-link, body:has(#panel-tools:not(.hidden)) #tools-link{ border-bottom-color:currentColor; }
  body:has(#panel-my-swaps:not(.hidden)) #tools-link, body:has(#panel-tools:not(.hidden)) #my-swaps-link{ opacity:.45; }
  html.themed #logged-in-tab-row{ background:transparent !important; border:none !important; border-radius:0 !important; padding:12px 0 !important; font-family:var(--sans) !important; }
  html.themed .tabs{ gap:0; border-bottom:1px solid var(--border); margin-bottom:18px; }
