name: "TROCA-MISTO · Flight Sync"
version: "1.0.0"
slug: "trocamisto_sync"
description: "Keeps TROCA-MISTO's flight info (gate, stand, check-in desk) updated by reading Flights4Staff from this Pi, since ANA blocks GitHub's own servers from reaching it"
url: "https://github.com/OkOtChA666/Troca-Misto"
arch:
  - aarch64
startup: application
boot: auto
init: false
options:
  planete_user: ""
  planete_pass: ""
  f4s_user: ""
  f4s_pass: ""
schema:
  planete_user: str
  planete_pass: password
  f4s_user: str
  f4s_pass: password
