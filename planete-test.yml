name: Planete test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install playwright@1.48.0
      - run: npx playwright install --with-deps chromium
      - run: node tools/planete-test.mjs
        env:
          PLANETE_USER: ${{ secrets.PLANETE_USER }}
          PLANETE_PASS: ${{ secrets.PLANETE_PASS }}
