name: Planete sync
on:
  schedule:
    # GitHub often skips or delays runs at :00 and :30, so ask at odd minutes, 4 times an hour.
    # Each run loops by itself (read every 5 min) for ~50 min; extra requests just wait in line and hand over.
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: planete-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - run: echo "START=$(date +%s)" >> $GITHUB_ENV
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install playwright@1.48.0
      - run: npx playwright install --with-deps chromium
      - run: node tools/planete-sync.mjs
        env:
          PLANETE_USER: ${{ secrets.PLANETE_USER }}
          PLANETE_PASS: ${{ secrets.PLANETE_PASS }}
          F4S_USER: ${{ secrets.F4S_USER }}
          F4S_PASS: ${{ secrets.F4S_PASS }}
          LOOP_MINUTES: '50'
      # GitHub's timer often skips runs, so a run that worked a full session starts the next one itself
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ $(( $(date +%s) - START )) -gt 600 ]; then gh workflow run planete-sync.yml --ref main; fi
