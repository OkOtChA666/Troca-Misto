name: Planete sync
on:
  schedule:
    # starts a long run every 30 minutes; each run loops by itself (read every 5 min) for ~50 min, runs queue up and hand over
    - cron: '*/30 * * * *'
  workflow_dispatch:
concurrency:
  group: ${{ github.event_name == 'schedule' && 'planete-sync' || 'planete-manual' }}
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install playwright@1.48.0
      - run: npx playwright install --with-deps chromium
      - run: node tools/planete-sync.mjs
        env:
          PLANETE_USER: ${{ secrets.PLANETE_USER }}
          PLANETE_PASS: ${{ secrets.PLANETE_PASS }}
          LOOP_MINUTES: ${{ github.event_name == 'schedule' && '50' || '3' }}
