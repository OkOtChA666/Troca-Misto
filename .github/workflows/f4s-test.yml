name: Flights4Staff test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install playwright@1.48.0
      - run: npx playwright install --with-deps chromium
      - run: node tools/f4s-test.mjs
        env:
          F4S_USER: ${{ secrets.F4S_USER }}
          F4S_PASS: ${{ secrets.F4S_PASS }}
